<!DOCTYPE html>

<html>
    <head>
        <title>Sistema de Gestión de Pacientes</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #333;
        }

        .contenedor {
            width: 95%;
            max-width: 1000px;
            margin: 60px auto;
        }

        .encabezado {
            background: #1976d2;
            color: white;
            padding: 45px 30px;
            text-align: center;
            border-radius: 15px 15px 0 0;
        }

        .encabezado h1 {
            margin: 0;
            font-size: 36px;
        }

        .encabezado p {
            margin: 12px 0 0;
            font-size: 17px;
        }

        .contenido {
            background: white;
            padding: 40px 30px;
            text-align: center;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        .contenido h2 {
            margin-top: 0;
            color: #1976d2;
            font-size: 26px;
        }

        .contenido p {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .botones {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            min-width: 220px;
            padding: 15px 25px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-registrar {
            background: #27ae60;
        }

        .btn-registrar:hover {
            background: #219150;
            transform: translateY(-2px);
        }

        .btn-lista {
            background: #1976d2;
        }

        .btn-lista:hover {
            background: #1565c0;
            transform: translateY(-2px);
        }

        .pie {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            .contenedor {
                margin: 25px auto;
            }

            .encabezado {
                padding: 35px 20px;
            }

            .encabezado h1 {
                font-size: 28px;
            }

            .contenido {
                padding: 30px 20px;
            }

            .botones {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="encabezado">

            <h1>Sistema de Gestión de Pacientes</h1>

            <p>
                Administración y registro de información de pacientes
            </p>

        </div>

        <div class="contenido">

            <h2>Bienvenido</h2>

            <p>
                Seleccione una opción para comenzar a utilizar
                el sistema.
            </p>

            <div class="botones">

                <a href="registroPaciente.jsp"
                   class="btn btn-registrar">
                    + Registrar paciente
                </a>

                <a href="listaPaciente.jsp"
                   class="btn btn-lista">
                    Ver pacientes
                </a>

            </div>

            <div class="pie">
                Sistema de Gestión de Pacientes
            </div>

        </div>

    </div>

</body>


</html>
